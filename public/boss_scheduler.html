<!DOCTYPE html>
<html lang="ja" data-theme="maple">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Scheduler - BijyonTools</title>
    <!-- 本体（index.html）と同じ Tailwind 4 + daisyUI 5。版も揃える。
         テーマ maple の値は boss_scheduler.css の先頭にある（style.css と同じ値）。
         boss_scheduler.css はレイヤーの外なので daisyUI の部品より強い。
         btn は daisyUI のものをそのまま使い、ここ独自の部品（PTカードなど）は boss_scheduler.css で描く。 -->
    <style>@layer theme, base, daisyui, components, utilities;</style>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.7.47/daisyui.css" rel="stylesheet" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-base-100: #0f172a; --color-base-200: #0b1222; --color-base-300: #020617; --color-base-content: #e2e8f0;
            --color-primary: #6366f1; --color-primary-content: #ffffff; --color-secondary: #a78bfa; --color-secondary-content: #1e1b4b;
            --color-error: #f87171; --color-error-content: #450a0a;
            --color-slate-950: #020617;
            --font-sans: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
            --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        @layer base {
            button:not(:disabled), [role="button"]:not(:disabled) { cursor: pointer; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="boss_scheduler.css">
    <script src="class_data.js" defer></script>
    <script src="boss_master.js" defer></script>
    <script src="boss_data.js" defer></script>
    <!-- メンバーとキャラはコミュニティ名簿の共有データ。編成より先に読み込む。 -->
    <script src="community_store.js" defer></script>
    <script src="boss_scheduler.js" defer></script>
</head>

<body class="h-screen flex flex-col font-sans text-sm bg-base-300 overflow-hidden">

    <!-- Tab buttons live in the host app's top bar (see index.html #scheduler-nav).
         They are kept here (hidden) so the existing tab wiring keeps working and
         the host can drive them by clicking. -->
    <header class="hidden">
        <nav>
            <button id="tab-members" data-tab="members" class="tab-btn tab-active">Members</button>
            <button id="tab-builder" data-tab="builder" class="tab-btn tab-inactive">Builder</button>
            <button id="tab-dashboard" data-tab="dashboard" class="tab-btn tab-inactive">Dashboard</button>
        </nav>
    </header>

    <!-- Season / data bar -->
    <div class="app-bar">
        <span class="season-label">Season</span>
        <input type="text" id="season-name" class="season-name" placeholder="シーズン名" />
        <span id="app-stats" class="app-stats"></span>
        <span class="spacer"></span>
        <!-- 共有DB(D1)との同期状態。押すと読み直し／競合の解消。 -->
        <button type="button" id="sync-status" class="sync-badge local"></button>
        <button class="btn btn-sm" id="btn-data">
            <i data-lucide="database" class="w-3.5 h-3.5"></i> データ
        </button>
    </div>

    <!-- Content -->
    <main class="flex-1 overflow-y-auto p-4">

        <!-- ====== ① メンバーと希望 ====== -->
        <section id="view-members">
            <div id="members-root"></div>
        </section>

        <!-- ====== ② 編成編集 ====== -->
        <section id="view-builder" class="hidden">
            <div id="builder-bar" class="builder-bar"></div>
            <div class="builder">
                <aside id="cand-pane" class="cand-pane"></aside>
                <div id="party-pane"></div>
            </div>
        </section>

        <!-- ====== ③ ダッシュボード ====== -->
        <section id="view-dashboard" class="hidden">
            <div id="dash-root"></div>
        </section>

    </main>

    <!-- =========================================================
         MODALS
         ========================================================= -->

    <!-- Confirm dialog.
         window.confirm() is suppressed when the app runs inside the host's
         iframe, so destructive actions ask here instead. -->
    <div id="confirm-modal" class="modal modal-open hidden">
        <div class="modal-box sb-modal" style="max-width: 380px;">
            <div class="modal-head">
                <div class="modal-title" id="confirm-title">確認</div>
            </div>
            <div class="modal-body">
                <p id="confirm-text" style="font-size:12.5px; line-height:1.7; margin:0;"></p>
            </div>
            <div class="modal-foot">
                <button class="btn btn-sm" id="confirm-cancel">キャンセル</button>
                <button class="btn btn-sm btn-primary" id="confirm-ok">OK</button>
            </div>
        </div>
    </div>

    <!-- ダッシュボードの画像出力プレビュー -->
    <div id="image-modal" class="modal modal-open hidden">
        <div class="modal-box sb-modal" style="max-width: 1200px;">
            <div class="modal-head">
                <div class="modal-title">編成の画像</div>
                <button class="btn btn-ghost btn-sm btn-square" data-close-image><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="modal-body">
                <p class="hint">
                    ダッシュボードの絞り込み（ボス・下書き・戦闘力の表示）がそのまま反映されます。
                </p>
                <div class="image-preview-box"><img id="image-preview" alt="編成の画像" /></div>
            </div>
            <div class="modal-foot">
                <span id="image-size" class="hint" style="margin:0; align-self:center;"></span>
                <span class="spacer"></span>
                <button class="btn btn-sm" id="btn-image-copy">
                    <i data-lucide="copy" class="w-3.5 h-3.5"></i> 画像をコピー
                </button>
                <button class="btn btn-sm btn-primary" id="btn-image-save">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i> 画像を保存
                </button>
                <button class="btn btn-sm" data-close-image>閉じる</button>
            </div>
        </div>
    </div>

    <!-- Data (JSON import / export) -->
    <div id="data-modal" class="modal modal-open hidden">
        <div class="modal-box sb-modal" style="max-width: 980px;">
            <div class="modal-head">
                <div class="modal-title">DATA</div>
                <button class="btn btn-ghost btn-sm btn-square" data-close-data><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="modal-body">
                <p class="hint">
                    編成データはこのブラウザに自動保存され、共有DB（Cloudflare D1）が有効な環境では
                    保存のたびに全員ぶんが同期されます。バックアップや別環境への持ち出しにはJSONを使ってください。
                </p>
                <div class="row" style="margin-bottom:10px;">
                    <label class="field" style="flex:1; min-width:220px;">編集キー（共有DBに保存する人だけ）
                        <input type="password" id="edit-key" placeholder="未設定なら空のまま" />
                    </label>
                    <span class="hint" style="flex:2; min-width:200px; margin:0;">
                        サーバー側で <code>SCHEDULER_EDIT_KEY</code> を設定している場合のみ必要です。
                        この端末にだけ保存され、他の人には送られません。
                    </span>
                </div>
                <div class="io-grid">
                    <div>
                        <div class="col-header">書き出し</div>
                        <div class="row" style="margin-bottom:6px;">
                            <button class="btn btn-sm btn-primary" id="btn-download">
                                <i data-lucide="download" class="w-3.5 h-3.5"></i> JSONをダウンロード
                            </button>
                            <button class="btn btn-sm" id="btn-copy-json">
                                <i data-lucide="copy" class="w-3.5 h-3.5"></i> コピー
                            </button>
                        </div>
                        <textarea id="json-out" readonly></textarea>
                    </div>
                    <div>
                        <div class="col-header">読み込み</div>
                        <div class="row" style="margin-bottom:6px;">
                            <input type="file" class="file-input file-input-sm" id="file-in" accept="application/json" />
                            <button class="btn btn-sm" id="btn-load-text">
                                <i data-lucide="upload" class="w-3.5 h-3.5"></i> 貼り付けたJSONを読み込む
                            </button>
                        </div>
                        <textarea id="json-in" placeholder="ここにJSONを貼り付けて「貼り付けたJSONを読み込む」"></textarea>
                    </div>
                </div>
            </div>
            <div class="modal-foot">
                <button class="btn btn-ghost btn-sm btn-danger" id="btn-sample">テストデータを入れる</button>
                <button class="btn btn-ghost btn-sm btn-danger" id="btn-wipe">すべて消す</button>
                <span class="spacer"></span>
                <button class="btn btn-sm" data-close-data>閉じる</button>
            </div>
        </div>
    </div>

</body>

</html>
