<!-- EXP Leaderboard & Progress のマークアップ。
     index.html の #view-ranks に、初回オープン時に読み込まれる
     （script.js の APPS テーブルを参照）。動かすのは ranks.js。 -->
<div class="max-w-[1600px] flex flex-col gap-3">
    <!-- キャラ追加の1行: 見出し・地域・検索・追加・全更新・名簿から追加 -->
    <section class="card card-sm bg-base-100 border border-base-content/10"><div class="card-body gap-2">
        <form id="ranks-import-form" class="flex flex-wrap items-center gap-2">
            <div class="leading-tight mr-2 shrink-0">
                <h2 class="font-bold text-sm text-white">EXP Tracker</h2>
                <p class="text-[11px] text-base-content/50">キャラ名で検索して追加。データはMapleHubから自動取得(日次スナップショット。取得した日の分はこのブラウザに貯まる)。</p>
            </div>
            <div class="join shrink-0">
                <button type="button" data-region="na" class="ranks-region-btn join-item btn btn-sm">NA</button>
                <button type="button" data-region="eu" class="ranks-region-btn join-item btn btn-sm">EU</button>
            </div>
            <label class="input input-sm flex-1 min-w-[220px]">
                <i data-lucide="search" class="w-3.5 h-3.5 text-base-content/40"></i>
                <input type="text" id="ranks-input-name" placeholder="キャラクター名で検索して追加">
            </label>
            <button type="submit" id="ranks-import-btn" class="btn btn-sm btn-primary">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>追加
            </button>
            <button type="button" id="ranks-refresh-all" class="btn btn-sm" title="全キャラのデータをMapleHubから再取得">
                <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>全更新
            </button>
            <!-- コミュニティ名簿から一括追加。表を広く使うため、手入力の追加と同じ行に置く。 -->
            <div id="ranks-community-row" class="hidden items-center gap-2 pl-2 border-l border-base-content/10">
                <button type="button" id="ranks-community-open" class="btn btn-sm">
                    <i data-lucide="users-round" class="w-3.5 h-3.5"></i>名簿から追加
                </button>
                <span id="ranks-community-note" class="text-[11px] text-base-content/50 whitespace-nowrap font-mono"></span>
            </div>
        </form>
        <div id="ranks-msg" class="hidden text-[11px] font-medium"></div>
    </div></section>

    <!-- リーダーボード / 推移 の切り替えは上部バー（index.html の ranks-nav）にある。 -->

    <!-- ===== Leaderboard tab ===== -->
    <div id="ranks-tab-board">
        <div class="card bg-base-100 border border-base-content/10 overflow-hidden">
            <div id="ranks-board-empty" class="flex flex-col items-center justify-center py-16 text-base-content/40">
                <i data-lucide="users" class="w-10 h-10 mb-3 opacity-40"></i>
                <p class="text-xs">上の検索バーからキャラクターを追加してください</p>
            </div>
            <div id="ranks-board-wrap" class="overflow-x-auto hidden">
                <table class="table table-sm min-w-[1200px]">
                    <thead id="ranks-board-head"></thead>
                    <tbody id="ranks-board-body"></tbody>
                </table>
            </div>
            <div class="px-3 py-1.5 border-t border-base-content/10 text-[11px] text-base-content/40">
                ヘッダークリックでソート / 行クリックで推移グラフを表示 / +1〜5Lv予測は14日平均、290・295到達予測は30日平均(無い場合は90日)ベース
            </div>
        </div>
    </div>

    <!-- ===== Trend tab ===== -->
    <div id="ranks-tab-trend" class="hidden">
        <div class="flex flex-col lg:flex-row gap-3 items-stretch">
            <!-- Character list (click to toggle) -->
            <section class="lg:w-[280px] shrink-0 card card-sm bg-base-100 border border-base-content/10"><div class="card-body gap-2">
                <h3 class="font-bold text-sm text-white">キャラクター <span class="text-[11px] font-normal text-base-content/50">クリックでグラフ表示切替</span></h3>
                <div id="ranks-trend-list" class="flex flex-col gap-1"></div>
            </div></section>
            <!-- Chart -->
            <section class="flex-1 card card-sm bg-base-100 border border-base-content/10 min-w-0"><div class="card-body gap-2">
                <div class="flex items-center justify-between gap-3 flex-wrap">
                    <div class="flex items-center gap-2 flex-wrap">
                        <span class="text-[11px] text-base-content/50">期間</span>
                        <div class="join">
                            <button type="button" data-range="7" class="ranks-range-btn join-item btn btn-xs">7d</button>
                            <button type="button" data-range="14" class="ranks-range-btn join-item btn btn-xs">14d</button>
                            <button type="button" data-range="30" class="ranks-range-btn join-item btn btn-xs">30d</button>
                            <button type="button" data-range="90" class="ranks-range-btn join-item btn btn-xs">90d</button>
                        </div>
                        <!-- 日付での期間指定。入れるとプリセットより優先される。 -->
                        <div class="flex items-center gap-1">
                            <input type="date" id="ranks-date-from" title="開始日" class="input input-xs w-32">
                            <span class="text-base-content/40 text-[11px]">〜</span>
                            <input type="date" id="ranks-date-to" title="終了日" class="input input-xs w-32">
                            <button type="button" id="ranks-date-clear" title="日付指定を解除" class="btn btn-ghost btn-xs btn-square">✕</button>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-[11px] text-base-content/50">Y軸</span>
                        <div class="join">
                            <button type="button" data-mode="absolute" class="ranks-mode-btn join-item btn btn-xs" title="Lv.XXX.XX%">レベル</button>
                            <button type="button" data-mode="delta" class="ranks-mode-btn join-item btn btn-xs" title="期間開始からの上昇レベル">Δレベル</button>
                            <button type="button" data-mode="expCum" class="ranks-mode-btn join-item btn btn-xs" title="期間開始からの累計獲得EXP">累積EXP</button>
                            <button type="button" data-mode="exp" class="ranks-mode-btn join-item btn btn-xs" title="日別の獲得EXP">日別EXP</button>
                        </div>
                    </div>
                </div>
                <div id="ranks-empty" class="flex flex-col items-center justify-center py-16 text-base-content/40">
                    <i data-lucide="bar-chart-2" class="w-10 h-10 mb-3 opacity-40"></i>
                    <p class="text-xs" data-empty-msg>左のリストからキャラクターを選択してください</p>
                </div>
                <div id="ranks-chart-wrap" class="hidden">
                    <div class="relative h-[480px]">
                        <canvas id="ranks-chart"></canvas>
                    </div>
                </div>
            </div></section>
        </div>
    </div>
</div>
